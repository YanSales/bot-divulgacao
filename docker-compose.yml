services:
  # Redis para cache e filas
  redis:
    image: redis:7-alpine
    container_name: bot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - bot-network

  # PostgreSQL (opcional - pode usar SQLite para dev)
  postgres:
    image: postgres:15-alpine
    container_name: bot-postgres
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot123
      POSTGRES_DB: bot_marketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot-network

  # API FastAPI
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bot-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://bot:bot123@postgres:5432/bot_marketing
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - bot-network

  # Scheduler (tarefas agendadas)
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    container_name: bot-scheduler
    environment:
      - DATABASE_URL=postgresql://bot:bot123@postgres:5432/bot_marketing
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m src.scheduler.jobs
    networks:
      - bot-network

  # Dashboard Streamlit
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: bot-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    depends_on:
      - api
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    networks:
      - bot-network

  # Celery Worker (processamento assíncrono)
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bot-celery-worker
    environment:
      - DATABASE_URL=postgresql://bot:bot123@postgres:5432/bot_marketing
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A src.scheduler.tasks worker --loglevel=info
    networks:
      - bot-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bot-network:
    driver: bridge